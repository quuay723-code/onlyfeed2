<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><meta name="theme-color" content="#09090c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ONLYFEED"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>ONLYFEED</title><style>
:root{color-scheme:dark;--lime:#c7ff55}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#09090c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;overscroll-behavior:none}button{font:inherit;cursor:pointer;color:inherit}#app{height:100dvh;overflow:hidden}.header{position:absolute;z-index:10;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;background:linear-gradient(#08080be8,#08080b00);pointer-events:none}.header>*{pointer-events:auto}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:950;letter-spacing:-.9px}.brand span{color:var(--lime)}.pill{border:1px solid #ffffff35;border-radius:99px;padding:8px 12px;background:#ffffff1b;font-size:12px}.niches{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:14px;padding-bottom:7px}.niches::-webkit-scrollbar{display:none}.chip{flex:none;border:1px solid #ffffff35;background:#ffffff17;border-radius:100px;padding:9px 15px;font-size:13px;font-weight:700;transition:background .2s,transform .2s}.chip:active{transform:scale(.94)}.chip.active{background:var(--lime);border-color:var(--lime);color:#111}.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth;overscroll-behavior-y:contain;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}.slide{height:100dvh;position:relative;scroll-snap-align:start;scroll-snap-stop:always;background:#0c0c11;overflow:hidden}.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.55) blur(12px);transform:scale(1.07)}.cover-main{position:absolute;inset:18% 0 10%;width:100%;height:70%;object-fit:contain}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0007 0%,transparent 26%,transparent 45%,#000c 100%);pointer-events:none}.player{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;z-index:1}.playbutton{position:absolute;z-index:3;top:49%;left:50%;transform:translate(-50%,-50%);background:#c7ff55;color:#111;border:0;border-radius:100px;padding:13px 20px;font-weight:800;box-shadow:0 4px 40px #0008}.metadata{position:absolute;z-index:4;left:16px;right:85px;bottom:calc(env(safe-area-inset-bottom) + 92px);pointer-events:none;text-shadow:0 2px 12px #000}.source{font-size:11px;font-weight:800;color:#fff;background:#ff0033;border-radius:4px;padding:4px 6px;display:inline-block;margin-bottom:10px}.creator{font-size:15px;font-weight:800}.title{font-size:16px;line-height:1.32;margin:7px 0 8px;font-weight:600}.hint{font-size:12px;color:#ddd}.actions{position:absolute;z-index:5;right:12px;bottom:calc(env(safe-area-inset-bottom) + 105px);display:flex;flex-direction:column;gap:15px;align-items:center}.action{display:grid;place-items:center;gap:4px;border:0;background:none;min-width:54px;font-size:11px;text-shadow:0 2px 9px #000}.action .symbol{display:grid;place-items:center;background:#0007;border:1px solid #ffffff2a;border-radius:50%;width:47px;height:47px;font-size:23px;backdrop-filter:blur(8px)}.action.on .symbol{color:var(--lime)}.bottom{position:absolute;z-index:11;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;height:calc(63px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(#09090cdd,#09090c);border-top:1px solid #ffffff16}.nav{background:none;border:0;display:grid;gap:4px;justify-items:center;color:#aaa;font-size:10px;font-weight:700;min-width:70px}.nav b{font-size:21px}.nav.active{color:var(--lime)}.toast{position:absolute;z-index:30;bottom:115px;left:50%;transform:translateX(-50%);background:#242429;border:1px solid #ffffff33;border-radius:15px;padding:11px 16px;white-space:nowrap;font-size:13px;box-shadow:0 5px 24px #0009}.empty{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px;text-align:center;gap:14px}.empty h2{margin:0}.empty p{color:#aaa;line-height:1.5}.empty button{background:var(--lime);color:#111;border:0;padding:13px 18px;border-radius:13px;font-weight:800}.slide-count{position:absolute;z-index:5;top:calc(env(safe-area-inset-top) + 112px);right:16px;font-size:11px;color:#ddd;background:#0008;padding:5px 9px;border-radius:30px}.loader{position:absolute;z-index:3;top:45%;left:50%;transform:translate(-50%,-50%);color:#eee;font-size:12px;text-align:center;pointer-events:none}.fineprint{font-size:11px;color:#b8b8bb}.offline{display:none;position:absolute;top:55%;z-index:4;left:10%;right:10%;text-align:center;color:#fff}.offline.show{display:block}
</style></head><body><div id="app"><div class="header"><div class="top"><div class="brand">ONLY<span>FEED</span></div><button class="pill" id="sound">🔇 Sound off</button></div><div class="niches" id="niches"></div></div><main class="feed" id="feed"></main><nav class="bottom"><button class="nav active" id="home"><b>⌂</b>Feed</button><button class="nav" id="saved"><b>▣</b>Saved</button><button class="nav" id="about"><b>ⓘ</b>About</button></nav></div><script>
const videos=[
{id:'53xTZp4UGP4',niche:'Barbering',title:'Barber tutorial — perfect skin taper fade',creator:'FADED CULTURE'},
{id:'C9ImuXCX-Fw',niche:'Cooking',title:'Easy pasta recipe, ready in five minutes',creator:'Angelo Coassin'},
{id:'SkmohwkKIh4',niche:'Cooking',title:'Easy pasta recipe #shorts',creator:'Village Food Hub'},
{id:'dUE8ScshE4o',niche:'Sneakers',title:'Rare Nike Jordan 1 sneaker collection',creator:'Walker Bryant'},
{id:'k0OSewmOMeQ',niche:'Cars',title:'Satisfying car detailing ASMR',creator:'DWAutocare'},
{id:'NXnRWwVeUBQ',niche:'Gaming',title:'Fortnite Chapter 7 gameplay',creator:'Nick Eh 30 Shorts'}
];
const niches=['For You','Barbering','Cooking','Sneakers','Cars','Gaming'];let niche=localStorage.getItem('of_niche')||'For You',mode='feed',current=0,muted=true,observer=null,activeIframe=null;const saved=new Set(JSON.parse(localStorage.getItem('of_saved')||'[]'));const liked=new Set(JSON.parse(localStorage.getItem('of_liked')||'[]'));const feed=document.querySelector('#feed');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function items(){let a=videos.filter(v=>mode==='saved'?saved.has(v.id):niche==='For You'||v.niche===niche);return a}function toast(s){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=s;document.querySelector('#app').append(t);setTimeout(()=>t.remove(),2000)}function nav(){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.id===(mode==='feed'?'home':mode)))}function render(){if(observer)observer.disconnect();activeIframe=null;feed.innerHTML='';nav();document.querySelector('#niches').innerHTML=niches.map(n=>`<button class="chip ${n===niche?'active':''}" data-niche="${n}">${n}</button>`).join('');document.querySelectorAll('[data-niche]').forEach(b=>b.onclick=()=>{niche=b.dataset.niche;localStorage.setItem('of_niche',niche);mode='feed';render()});if(mode==='about'){feed.innerHTML='<div class="empty"><h2>One feed. Your interests.</h2><p>ONLYFEED v0.2 is an early prototype featuring a small, hand-picked selection of YouTube videos. TikTok, Instagram and Facebook feeds are not connected. Embedded video playback depends on YouTube availability and permissions.</p><button id="back">Back to feed</button><div class="fineprint">Made for iPhone · GitHub Pages</div></div>';document.querySelector('#back').onclick=()=>{mode='feed';render()};return}let list=items();if(!list.length){feed.innerHTML='<div class="empty"><h2>No saved videos yet</h2><p>Tap the bookmark on any video to save it here.</p><button id="back">Explore videos</button></div>';document.querySelector('#back').onclick=()=>{mode='feed';render()};return}feed.innerHTML=list.map((v,i)=>`<section class="slide" data-id="${v.id}" data-i="${i}"><img class="cover" alt="" loading="lazy" src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg"><img class="cover-main" alt="Video thumbnail" loading="lazy" src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg"><div class="shade"></div><div class="slide-count">${i+1} / ${list.length}</div><div class="loader">Tap play to watch on YouTube<br><small>Swipe up for the next video</small></div><button class="playbutton" data-play="${v.id}">▶ Play video</button><div class="metadata"><span class="source">▶ YouTube</span><div class="creator">@${esc(v.creator)}</div><div class="title">${esc(v.title)}</div><div class="hint">${esc(v.niche)} · Swipe up ↑</div></div><div class="actions"><button class="action ${liked.has(v.id)?'on':''}" data-like="${v.id}"><span class="symbol">♥</span>Like</button><button class="action ${saved.has(v.id)?'on':''}" data-save="${v.id}"><span class="symbol">▣</span>Save</button><button class="action" data-share="${v.id}"><span class="symbol">↗</span>Share</button><button class="action" data-open="${v.id}"><span class="symbol">▷</span>YouTube</button></div></section>`).join('');feed.scrollTop=0;current=0;observer=new IntersectionObserver(entries=>{for(const e of entries){if(e.isIntersecting&&e.intersectionRatio>.65){current=Number(e.target.dataset.i);if(activeIframe&&!e.target.contains(activeIframe)){activeIframe.remove();activeIframe=null} }}},{root:feed,threshold:[.65]});document.querySelectorAll('.slide').forEach(s=>observer.observe(s));document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>play(b.dataset.play));document.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>toggle(liked,'of_liked',b.dataset.like,b));document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>toggle(saved,'of_saved',b.dataset.save,b));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>window.open('https://www.youtube.com/watch?v='+b.dataset.open,'_blank','noopener'));document.querySelectorAll('[data-share]').forEach(b=>b.onclick=async()=>{let url='https://www.youtube.com/watch?v='+b.dataset.share;try{if(navigator.share)await navigator.share({url});else{await navigator.clipboard.writeText(url);toast('Link copied')}}catch(e){}})}function toggle(set,key,id,b){set.has(id)?set.delete(id):set.add(id);localStorage.setItem(key,JSON.stringify([...set]));b.classList.toggle('on',set.has(id));toast(set.has(id)?'Saved!':'Updated');if(mode==='saved')render()}function play(id){let section=document.querySelector(`.slide[data-id="${id}"]`);if(!section)return;if(activeIframe){activeIframe.remove();activeIframe=null}const f=document.createElement('iframe');f.className='player';f.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';f.title='YouTube video player';f.src=`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&rel=0&mute=${muted?1:0}`;section.append(f);activeIframe=f;section.querySelector('.playbutton').style.display='none';section.querySelector('.loader').style.display='none';toast('Swipe to the next video');}document.querySelector('#home').onclick=()=>{mode='feed';render()};document.querySelector('#saved').onclick=()=>{mode='saved';render()};document.querySelector('#about').onclick=()=>{mode='about';render()};document.querySelector('#sound').onclick=()=>{muted=!muted;document.querySelector('#sound').textContent=muted?'🔇 Sound off':'🔊 Sound on';toast('Sound setting applies to next video')};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
